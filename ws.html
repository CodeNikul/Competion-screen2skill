<!DOCTYPE html>
<html>
<head>
<title>Pro 3D Editor</title>
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;background:#111;color:#fff}

.menuBtn{
position:absolute;top:10px;right:10px;z-index:20;
background:#222;color:white;border:none;padding:8px;border-radius:6px;
cursor:pointer;
}

.sidebar{
position:absolute;top:0;left:0;width:270px;height:100%;
background:#1b1b1b;padding:15px;overflow:auto;
box-shadow:3px 0 15px rgba(0,0,0,0.5);
}

h2,h4{margin:10px 0}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
}

button{
background:#333;color:white;border:none;padding:8px;
border-radius:6px;cursor:pointer;
}
button:hover{background:#555}

.colorBtn{
width:28px;height:28px;border-radius:50%;border:none;margin:2px;
}

#objectsList{
background:#222;padding:8px;border-radius:6px;
max-height:150px;overflow:auto;font-size:13px;
}

.objItem{
padding:4px;border-bottom:1px solid #444;cursor:pointer;
}
.objItem:hover{background:#444}

</style>
</head>

<body>
<nav>
    <div>
        <a href="Home Index.html">Home</a>
        <a href="mailto:screen2skills@gmail.com">Contact</a>
    </div>
</nav>
<button onclick="toggleUI()" class="menuBtn">☰</button>

<div id="uiPanel" class="sidebar">

<h2>🎨 3D Editor</h2>

<h4>Shapes</h4>
<div class="grid">
<button onclick="addShape('cube')">Cube</button>
<button onclick="addShape('sphere')">Sphere</button>
<button onclick="addShape('cylinder')">Cylinder</button>
<button onclick="addShape('cone')">Cone</button>
<button onclick="addShape('torus')">Torus</button>
<button onclick="addShape('torusKnot')">TorusKnot</button>
<button onclick="addShape('plane')">Plane</button>
<button onclick="addShape('ring')">Ring</button>
<button onclick="addShape('capsule')">Capsule</button>
<button onclick="addShape('icosahedron')">Icosahedron</button>
<button onclick="addShape('dodecahedron')">Dodecahedron</button>
<button onclick="addShape('octahedron')">Octahedron</button>
<button onclick="addShape('tetrahedron')">Tetrahedron</button>
<button onclick="addShape('circle')">Circle</button>
<button onclick="addShape('tube')">Tube</button>
</div>

<hr>

<h4>Scene Objects</h4>
<div id="objectsList"></div>

<hr>

<h4>Color</h4>
<div>
<button class="colorBtn" style="background:red" onclick="setColor('red')"></button>
<button class="colorBtn" style="background:green" onclick="setColor('green')"></button>
<button class="colorBtn" style="background:blue" onclick="setColor('blue')"></button>
<button class="colorBtn" style="background:yellow" onclick="setColor('yellow')"></button>
</div>

<input type="color" id="colorPicker">

<hr>

<p style="font-size:12px;">
G = Move | S = Scale | R = Rotate<br>
X/Y/Z = Axis Lock<br>
Delete = Remove
</p>

</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xeeeeee);

// CAMERA
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.set(6,6,6);
camera.lookAt(0,0,0);

// RENDERER
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const light=new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,10,10);
scene.add(light);

// GRID
scene.add(new THREE.GridHelper(20,20));

// AXIS HELPER
const axisHelper=new THREE.AxesHelper(2);
axisHelper.visible=false;
scene.add(axisHelper);

// SYSTEM
let objects=[];
let selected=null;
let mode=null;
let axis="all";

let prevMouse={x:0,y:0};

// UI
window.toggleUI=()=>{
const p=document.getElementById("uiPanel");
p.style.display=p.style.display==="none"?"block":"none";
};

// SHAPE FACTORY
function createGeometry(type){
switch(type){
case "cube": return new THREE.BoxGeometry();
case "sphere": return new THREE.SphereGeometry(0.5,32,32);
case "cylinder": return new THREE.CylinderGeometry(0.5,0.5,1,32);
case "cone": return new THREE.ConeGeometry(0.5,1,32);
case "torus": return new THREE.TorusGeometry(0.6,0.2,16,100);
case "torusKnot": return new THREE.TorusKnotGeometry(0.5,0.15,100,16);
case "plane": return new THREE.PlaneGeometry(2,2);
case "ring": return new THREE.RingGeometry(0.5,1,32);
case "capsule": return new THREE.CapsuleGeometry(0.4,1,8,16);
case "icosahedron": return new THREE.IcosahedronGeometry(0.7);
case "dodecahedron": return new THREE.DodecahedronGeometry(0.7);
case "octahedron": return new THREE.OctahedronGeometry(0.7);
case "tetrahedron": return new THREE.TetrahedronGeometry(0.7);
case "circle": return new THREE.CircleGeometry(1,32);
case "tube":
const path=new THREE.CatmullRomCurve3([
new THREE.Vector3(-1,0,0),
new THREE.Vector3(0,1,0),
new THREE.Vector3(1,0,0)
]);
return new THREE.TubeGeometry(path,20,0.2,8,false);
}
}

window.addShape=(type)=>{
const mesh=new THREE.Mesh(
createGeometry(type),
new THREE.MeshStandardMaterial({color:Math.random()*0xffffff})
);

mesh.position.set(0,0.5,0);
scene.add(mesh);
objects.push(mesh);

updateObjectList();
};

// OBJECT LIST
function updateObjectList(){
const list=document.getElementById("objectsList");
list.innerHTML="";
objects.forEach((obj,i)=>{
const div=document.createElement("div");
div.className="objItem";
div.innerText="Object "+i;
div.onclick=()=>{
selected=obj;
axisHelper.visible=true;
axisHelper.position.copy(obj.position);
};
list.appendChild(div);
});
}

// COLOR
window.setColor=(c)=>{
if(selected) selected.material.color.set(c);
};

document.getElementById("colorPicker").addEventListener("input",(e)=>{
if(selected) selected.material.color.set(e.target.value);
});

// SELECTION
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

window.addEventListener("click",(e)=>{
mouse.x=(e.clientX/innerWidth)*2-1;
mouse.y=-(e.clientY/innerHeight)*2+1;

raycaster.setFromCamera(mouse,camera);
const hits=raycaster.intersectObjects(objects);

if(hits.length>0){
selected=hits[0].object;
axisHelper.visible=true;
axisHelper.position.copy(selected.position);
}
});

// CONTROLS
window.addEventListener("keydown",(e)=>{
if(!selected) return;

if(e.key==="g") mode="move";
if(e.key==="s") mode="scale";
if(e.key==="r") mode="rotate";

if(e.key==="x") axis="x";
if(e.key==="y") axis="y";
if(e.key==="z") axis="z";

if(e.key==="Delete"){
scene.remove(selected);
objects=objects.filter(o=>o!==selected);
selected=null;
axisHelper.visible=false;
updateObjectList();
}
});

window.addEventListener("mousedown",(e)=>{
prevMouse.x=e.clientX;
prevMouse.y=e.clientY;
});

window.addEventListener("mousemove",(e)=>{
if(!selected||!mode) return;

let dx=e.clientX-prevMouse.x;
let dy=e.clientY-prevMouse.y;

const speed=0.01;

if(mode==="move"){
selected.position.x+=dx*0.01;
selected.position.z-=dx*0.01;
}

if(mode==="scale"){
selected.scale.multiplyScalar(1+(dx-dy)*0.01);
}

if(mode==="rotate"){
if(axis==="x") selected.rotation.x+=dy*speed;
else if(axis==="y") selected.rotation.y+=dx*speed;
else if(axis==="z") selected.rotation.z+=dx*speed;
else{
selected.rotation.x+=dy*speed;
selected.rotation.y+=dx*speed;
}
}

axisHelper.position.copy(selected.position);

prevMouse.x=e.clientX;
prevMouse.y=e.clientY;
});

window.addEventListener("mouseup",()=>{
mode=null;
axis="all";
});

// CAMERA
let rotating=false,lastX=0,lastY=0;

window.addEventListener("mousedown",(e)=>{
if(e.button===2){
rotating=true;
lastX=e.clientX;
lastY=e.clientY;
}
});

window.addEventListener("mousemove",(e)=>{
if(rotating){
let dx=(e.clientX-lastX)*0.005;
let dy=(e.clientY-lastY)*0.005;

camera.position.x+=dx*5;
camera.position.y+=dy*5;
camera.lookAt(0,0,0);

lastX=e.clientX;
lastY=e.clientY;
}
});

window.addEventListener("mouseup",()=>rotating=false);

window.addEventListener("wheel",(e)=>{
camera.position.z+=e.deltaY*0.01;
});

window.addEventListener("contextmenu",e=>e.preventDefault());

// LOOP
function animate(){
requestAnimationFrame(animate);
renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
